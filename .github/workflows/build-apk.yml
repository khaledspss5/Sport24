
name: Build Sport24 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sport24Android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q Sport24Android.zip -d project-src
          echo "PROJECT_DIR=$(dirname "$(find project-src -name settings.gradle.kts -print -quit)")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sport24-APK
          path: project-src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
